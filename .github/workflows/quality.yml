name: quality

# Pushes to master run these checks through the release workflow.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: make ui-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The test job owns the shared Go cache; golangci-lint keeps its own.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - run: golangci-lint fmt --diff
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -cover ./...
      - run: go test -race ./...
      - run: git diff --check
